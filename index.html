<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>估值看板 · 全市场</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1e3a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e7ebf1;
    --text:#1c2330; --muted:#69738a; --dim:#9aa3b5; --accent:#2f6fed;
    --green:#0aa06e; --yellow:#d99a06; --red:#e0384e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;font-size:15px;-webkit-font-smoothing:antialiased}
  header{padding:14px 16px 0;position:sticky;top:0;background:rgba(244,246,249,.96);
    backdrop-filter:blur(14px);z-index:20;border-bottom:1px solid var(--line)}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .top h1{font-size:1.05rem;font-weight:600}
  .top .sub{font-size:.63rem;color:var(--dim);margin-top:2px}
  #refresh{border:1px solid var(--line);background:var(--card);box-shadow:0 1px 3px rgba(20,40,80,.06);color:var(--accent);
    padding:6px 12px;border-radius:9px;font-size:.75rem}
  #refresh:active{transform:scale(.95)}
  /* 市场切换 */
  .mkts{display:flex;gap:6px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .mkts::-webkit-scrollbar{display:none}
  .mkts button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:7px 15px;border-radius:19px;font-size:.78rem;transition:.18s;white-space:nowrap}
  .mkts button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  main{padding:13px;max-width:720px;margin:0 auto}

  /* 温度卡片 */
  .hero{background:linear-gradient(135deg,#2f6fed,#5a8cf5);border:1px solid #2f6fed;box-shadow:0 6px 20px rgba(47,111,237,.25);
    border-radius:17px;padding:16px;margin-bottom:11px}
  .hero .lbl{font-size:.69rem;color:rgba(255,255,255,.85);display:flex;justify-content:space-between;align-items:center}
  .hero .lbl .badge{font-size:.58rem;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.22);color:#fff}
  .hero .val{font-size:2rem;font-weight:700;letter-spacing:-1px;margin-top:5px}
  .hero .val{color:#fff}.hero .val small{font-size:.75rem;font-weight:400;color:rgba(255,255,255,.8);margin-left:5px;letter-spacing:0}
  .gauge{height:8px;border-radius:5px;margin-top:13px;position:relative;
    background:linear-gradient(90deg,#16c784,#f0b90b,#f6465d)}
  .gauge i{position:absolute;top:-4px;width:3px;height:16px;background:#fff;border-radius:2px;
    box-shadow:0 0 6px rgba(0,0,0,.3);transition:left .5s}
  .gl{display:flex;justify-content:space-between;font-size:.58rem;color:rgba(255,255,255,.75);margin-top:4px}
  .mins{display:flex;gap:14px;margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
  .mins{border-top:1px solid rgba(255,255,255,.25)!important}.mins div{font-size:.62rem;color:rgba(255,255,255,.85)}
  .mins b{font-size:.9rem;font-weight:700;margin-right:3px;color:#fff}

  /* 市场对比 */
  .cmps{font-size:.7rem;color:var(--muted);margin:14px 0 8px;letter-spacing:.4px}
  .cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .cmp div{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 8px;text-align:center;transition:.18s;box-shadow:0 1px 4px rgba(20,40,80,.05)}
  .cmp div.on{border-color:var(--accent);background:rgba(47,111,237,.07)}
  .cmp .nm2{font-size:.66rem;color:var(--muted);margin-bottom:3px}
  .cmp .tv{font-size:1.25rem;font-weight:700;letter-spacing:-.5px}
  .cmp .st{font-size:.56rem;color:var(--dim);margin-top:2px}

  /* 数据表格（数据网站风格） */
  .tbl{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 1px 4px rgba(20,40,80,.05)}
  .thead,.trow{display:grid;grid-template-columns:minmax(86px,1.15fr) .95fr .95fr .62fr;gap:4px;
    align-items:center;padding:9px 10px}
  .thead{background:#f8fafc;color:var(--dim);font-size:.58rem;border-bottom:1px solid var(--line)}
  .trow{border-bottom:1px solid #f0f2f6;font-size:.72rem}
  .trow:last-child{border:none}
  .trow .nm{font-size:.76rem}
  .rng{font-size:.55rem;color:var(--dim);margin-top:2px}
  .rng b{color:var(--accent);font-weight:600}
  .trow.low{background:rgba(10,160,110,.055)}
  .trow.high{background:rgba(224,56,78,.05)}
  .cell .v{font-weight:700;font-size:.78rem}
  .cell .p{font-size:.56rem;margin-top:1px}
  .mini{height:3px;background:#edf0f5;border-radius:2px;margin-top:3px;position:relative;overflow:hidden}
  .mini i{position:absolute;left:0;top:0;height:100%;border-radius:2px}
  .rate{font-size:.6rem;padding:3px 0;text-align:center;border-radius:7px;font-weight:600}
  .detail{background:#f8fafc;font-size:.62rem;color:var(--muted);padding:8px 12px 9px;line-height:1.7;
    border-bottom:1px solid var(--line)}
  .bg-low{background:rgba(10,160,110,.18)}.bg-mid{background:rgba(217,154,6,.18)}.bg-high{background:rgba(224,56,78,.18)}
  .tag{font-size:.55rem;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:1.5px;background:rgba(79,140,255,.14);color:var(--accent)}

  /* 次级筛选 */
  .filters{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 9px}
  .chips{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);
    padding:5px 11px;border-radius:13px;font-size:.71rem}
  .chips button.on{background:rgba(47,111,237,.1);border-color:rgba(47,111,237,.45);color:var(--accent)}
  .sortbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:5px 10px;border-radius:11px;font-size:.71rem;white-space:nowrap}
  .cnt{font-size:.65rem;color:var(--dim);margin-bottom:8px}
  .empty{text-align:center;color:var(--dim);padding:36px 0;font-size:.82rem}
  footer{text-align:center;font-size:.57rem;color:var(--dim);padding:16px 0 6px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>📊 估值看板</h1><div class="sub" id="upd">加载中…</div></div>
    <button id="refresh">↻ 刷新</button>
  </div>
  <div class="mkts" id="mkts">
    <button data-m="all" class="on">全市场</button>
    <button data-m="cn">A股</button>
    <button data-m="us">美股</button>
    <button data-m="hk">港股</button>
  </div>
</header>
<main>
  <div class="hero">
    <div class="lbl"><span id="heroLbl">全市场估值温度</span><span class="badge" id="heroWord">--</span></div>
    <div class="val"><span id="tempVal">--</span><small>/ 100 · <span id="tempDesc">分位数均值</span></small></div>
    <div class="gauge"><i id="tempPin" style="left:50%"></i></div>
    <div class="gl"><span>历史低位</span><span>中位</span><span>历史高位</span></div>
    <div class="mins" id="mins"></div>
  </div>

  <div class="cmps">各市场对比 · 点击切换</div>
  <div class="cmp" id="cmp"></div>

  <div class="filters">
    <div class="chips" id="chips">
      <button data-k="all" class="on">全部</button>
      <button data-k="broad">宽基</button>
      <button data-k="sector">行业</button>
      <button data-k="low">仅低估</button>
      <button data-k="high">仅高估</button>
    </div>
    <button class="sortbtn" id="sortBtn">分位 ↑</button>
  </div>
  <div class="cnt" id="cnt"></div>
  <div id="list"></div>

  <footer>
    数据来源：蛋卷基金 · 腾讯行情<br>
    分位 = 当前 PE 在历史区间中的位置；温度 = 组内分位均值<br>
    仅供参考，不构成投资建议
  </footer>
</main>
<script>
let D = null, mkt = 'all', kind = 'all', sortAsc = true;
const $ = s => document.querySelector(s);
const MN = {all:'全市场', cn:'A股', us:'美股', hk:'港股'};
const cls = p => p < 30 ? 'low' : p < 70 ? 'mid' : 'high';
const txt = p => p < 30 ? '低估' : p < 70 ? '中性' : '高估';
const col = p => p < 30 ? 'var(--green)' : p < 70 ? 'var(--yellow)' : 'var(--red)';
const tw = t => t < 30 ? '低位 · 可积极' : t < 50 ? '中低 · 逢低布局' : t < 70 ? '中性 · 持有观望' : t < 85 ? '偏高 · 谨慎追高' : '高位 · 注意风险';

function renderHero() {
  const s = D.markets[mkt];
  if (!s) return;
  $('#heroLbl').textContent = MN[mkt] + '估值温度';
  $('#heroWord').textContent = tw(s.temp);
  $('#tempVal').textContent = s.temp;
  $('#tempPin').style.left = Math.min(97, Math.max(3, s.temp)) + '%';
  $('#mins').innerHTML = `
    <div><b style="color:#7dffc9">${s.low}</b>低估</div>
    <div><b style="color:#ffe08a">${s.mid}</b>中性</div>
    <div><b style="color:#ffa1ae">${s.high}</b>高估</div>
    <div><b style="color:var(--text)">${s.count}</b>指数</div>`;
}

function renderCmp() {
  const order = ['cn','us','hk'].filter(k => D.markets[k]);
  $('#cmp').innerHTML = order.map(k => {
    const s = D.markets[k];
    return `<div class="${k===mkt?'on':''}" data-cm="${k}">
      <div class="nm2">${MN[k]}</div>
      <div class="tv" style="color:${col(s.temp)}">${s.temp}</div>
      <div class="st">${s.low}低 / ${s.high}高</div>
    </div>`;
  }).join('');
}

function renderList() {
  let list = D.indices.filter(x => mkt === 'all' || x.market === mkt);
  if (kind === 'broad' || kind === 'sector') list = list.filter(x => x.kind === kind);
  else if (kind === 'low') list = list.filter(x => x.pePct < 30);
  else if (kind === 'high') list = list.filter(x => x.pePct >= 70);
  list = list.slice().sort((a,b) => sortAsc ? a.pePct - b.pePct : b.pePct - a.pePct);
  $('#cnt').textContent = `${MN[mkt]} · ${list.length} 个指数 · 按PE分位${sortAsc?'低→高':'高→低'} · 点名称查看详情`;
  $('#list').innerHTML = list.length ? `<div class="tbl">
    <div class="thead"><span>指数</span><span>PE / 分位</span><span>PB / 分位</span><span style="text-align:center">评级</span></div>
    ${list.map(x => `
    <div class="trow ${cls(x.pePct)}" data-code="${x.code}">
      <div class="nm">${x.name}${x.kind==='broad'?'<span class="tag">宽基</span>':''}</div>
      ${x.peLo?`<div class="rng">10年PE ${x.peLo} ~ ${x.peHi}</div>`:''}
      <div class="cell"><span class="v" style="color:${col(x.pePct)}">${x.pe}</span>
        <div class="p" style="color:${col(x.pePct)}">${x.pePct}%</div>
        <div class="mini"><i class="bg-${cls(x.pePct)}" style="width:${x.pePct}%"></i></div></div>
      <div class="cell"><span class="v" style="color:${col(x.pbPct)}">${x.pb}</span>
        <div class="p" style="color:${col(x.pbPct)}">${x.pbPct}%</div>
        <div class="mini"><i class="bg-${cls(x.pbPct)}" style="width:${x.pbPct}%"></i></div></div>
      <div><div class="rate bg-${cls(x.pePct)}" style="color:${col(x.pePct)}">${txt(x.pePct)}</div></div>
    </div>`).join('')}</div>` : '<div class="empty">该条件下没有指数</div>';
}

function renderAll() { renderHero(); renderCmp(); renderList(); }

async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now());
    D = await r.json();
    $('#upd').textContent = '更新于 ' + D.generated_at;
    renderAll();
  } catch (e) {
    $('#list').innerHTML = '<div class="empty">加载失败，请点击刷新重试</div>';
  }
}

$('#mkts').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#mkts button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); mkt = b.dataset.m; renderAll();
};
$('#cmp').onclick = e => {
  const d = e.target.closest('[data-cm]'); if (!d) return;
  mkt = d.dataset.cm;
  document.querySelectorAll('#mkts button').forEach(x => x.classList.toggle('on', x.dataset.m === mkt));
  renderAll();
};
$('#chips').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#chips button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); kind = b.dataset.k; renderList();
};
$('#sortBtn').onclick = () => {
  sortAsc = !sortAsc;
  $('#sortBtn').textContent = '分位 ' + (sortAsc ? '↑' : '↓');
  renderList();
};
$('#list').onclick = e => {
  const r = e.target.closest('.trow'); if (!r) return;
  const det = r.nextElementSibling;
  if (det && det.classList.contains('detail')) { det.remove(); return; }
  document.querySelectorAll('.detail').forEach(x => x.remove());
  const x = D.indices.find(i => i.code === r.dataset.code); if (!x) return;
  const div = document.createElement('div');
  div.className = 'detail';
  const pos = x.peLo && x.pe > x.peLo && x.peHi ? Math.round((x.pe - x.peLo) / (x.peHi - x.peLo) * 100) : null;
  div.innerHTML = `代码 ${x.code} · ROE ${x.roe}% · 股息率 ${x.div}% · 国债参考 ${x.bond}%<br>盈利收益率(1/PE) ${(100/x.pe).toFixed(2)}% · PE分位 ${x.pePct}% · PB分位 ${x.pbPct}%${pos!==null?`<br>10年PE区间 ${x.peLo} ~ ${x.peHi} · 当前位于区间的 ${pos}% 位置`:''}`;
  r.after(div);
};
$('#refresh').onclick = load;
load();
</script>
</body>
</html>
