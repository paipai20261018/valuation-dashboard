name: 更新估值数据
on:
  schedule:
    - cron: "20 1 * * 1-5"    # 北京 9:20
    - cron: "40 7 * * 1-5"    # 北京 15:40 收盘后
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python fetch_data.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "更新估值数据 $(date -u +%m-%d)"
          git push
